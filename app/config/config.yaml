defaults:
  - _self_
  - pipeline: default
  - model: scibert
  - chunking: semantic
  - data: main
  - similarity: hybrid  # or bi_encoder, cross_encoder

paths:
  faiss_index: app/vector_db/faiss_index
  chunks_dir: app/chunks
  downloads_dir: app/downloads

openai:
  model: gpt-4o
  temperature: 0.0
  max_tokens: 150

pipeline:
  query: "transformers in healthcare"
  max_results: 7
  top_k: 3
  max_workers: 8

# LLM evaluation configuration
llm_evaluation:
  enabled: false  # Set to false to disable LLM evaluation
  qa_file: null  # Path to QA pairs file (null = use default)
  judge_model: "gpt-4o"  # Model to use for judging
  batch_size: 2  # Batch size for evaluation

pipeline:
  query: "transformers in healthcare"
  max_results: 2  # Reduced for testing
  top_k: 3
  max_workers: 8
  deduplicate: false  # Set to false to skip deduplication
  similarity_threshold: 0.95
  keep_strategy: "first"  # Options: first, longest, highest_score 
