paths:
  faiss_index: app/vector_db/faiss_index
  chunks_dir: app/chunks
  downloads_dir: app/downloads
openai:
  model: gpt-4o
  temperature: 0.3
  max_tokens: 150
db:
  top_k: 3
llm_evaluation:
  enabled: true
  qa_file: null
  judge_model: gpt-4o
  batch_size: 2
similarity:
  strategy: hybrid
  bi_encoder:
    model: all-MiniLM-L6-v2
  cross_encoder:
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    batch_size: 32
  hybrid:
    candidate_multiplier: 10
    batch_size: 32
    top_k_v1: 15
    top_k_v2: 5
pipeline:
  query: transformers in healthcare
  max_results: 5
  top_k: 3
  max_workers: 8
  deduplicate: true
  similarity_threshold: 0.95
  keep_strategy: first
model:
  openai:
    model: gpt-3.5-turbo
    temperature: 0.0
    max_tokens: 200
  embedding:
    model_name: allenai/specter2_base
chunking:
  strategy: semantic
  chunk_size: 5
  overlap: 2
  similarity_threshold: 0.9
data:
  paths:
    faiss_index: app/vector_db/faiss_index
    chunks_dir: app/chunks
    downloads_dir: app/downloads
